<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg:    #07090F;
        --gold:  #F5C500;
        --white: #FFFFFF;
        --teal:  #00B4A6;
        --muted: #7A7A90;
        --font:  'Anton', sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: var(--bg);
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      /* ── Hero frame layout — builder-contract flex centering ── */
      .scene-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        width: 100%;
        height: 100%;
        padding: 120px 96px;
        gap: 0;
        box-sizing: border-box;
      }
      /* MARTINIK */
      #martinik-text {
        font-family: var(--font);
        font-size: 148px;
        color: var(--gold);
        letter-spacing: 0.1em;
        line-height: 1;
        display: block;
        text-transform: uppercase;
      }
      /* Gold underline */
      #martinik-line {
        width: 100%;
        height: 5px;
        background: var(--gold);
        margin-top: 10px;
        transform-origin: left center;
      }
      /* CUP */
      #cup-text {
        font-family: var(--font);
        font-size: 290px;
        color: var(--white);
        letter-spacing: -0.02em;
        line-height: 1;
        display: block;
        margin-top: 12px;
      }
      /* Teal accent bar */
      #accent-bar {
        width: 128px;
        height: 6px;
        background: var(--teal);
        margin-top: 20px;
        transform-origin: left center;
      }
      /* Tagline */
      #tagline {
        font-family: var(--font);
        font-size: 30px;
        color: var(--muted);
        letter-spacing: 0.38em;
        margin-top: 40px;
        display: block;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="martinik-cup"
      data-start="0"
      data-duration="8"
      data-width="1080"
      data-height="1920"
    >
      <div id="main-clip" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div id="content-fade" style="position:absolute;inset:0;">
          <div class="scene-content">
            <span id="martinik-text">MARTINIK</span>
            <div id="martinik-line"></div>
            <span id="cup-text">CUP</span>
            <div id="accent-bar"></div>
            <span id="tagline">MARTINIQUE · 2025</span>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      /* MARTINIK visible at t=0 (thumbnail), subtle emphasis pulse at t=0.4 */
      tl.to(
        "#martinik-text",
        { scale: 1.04, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 },
        0.4
      );

      /* ── Gold underline sweeps left → right ── */
      tl.fromTo(
        "#martinik-line",
        { autoAlpha: 0, scaleX: 0 },
        { autoAlpha: 1, scaleX: 1, duration: 0.45, ease: "power2.out" },
        0.25
      );

      /* ── Scene 2: CUP punches in (scale_punch) ── */
      tl.fromTo(
        "#cup-text",
        { autoAlpha: 0, scale: 0.35 },
        { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(2.0)" },
        1.8
      );

      /* ── Scale pulse on CUP at peak ── */
      tl.to(
        "#cup-text",
        { scale: 1.05, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 },
        3.0
      );

      /* ── Teal accent bar wipes in ── */
      tl.fromTo(
        "#accent-bar",
        { autoAlpha: 0, scaleX: 0 },
        { autoAlpha: 1, scaleX: 1, duration: 0.45, ease: "power2.out" },
        3.4
      );

      /* ── Tagline slides up and fades in ── */
      tl.fromTo(
        "#tagline",
        { autoAlpha: 0, y: 24 },
        { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" },
        4.2
      );

      /* ── Fade out — target inner wrapper, not the clip ── */
      tl.to(
        "#content-fade",
        { autoAlpha: 0, duration: 0.8, ease: "power2.in" },
        7.0
      );

      window.__timelines["martinik-cup"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
